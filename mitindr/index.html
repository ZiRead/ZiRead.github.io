<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поздравление для Ангелины</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap&subset=cyrillic" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=welcome-screen-3">
</head>
<body>
  <audio id="birthday-music" src="108162c0c0f5827.mp3" loop preload="auto" playsinline></audio>

  <section class="welcome-screen" id="welcome-screen" aria-label="Начало поздравления">
    <div class="welcome-content">
      <span class="welcome-sparkle" aria-hidden="true">✦</span>
      <button class="welcome-button" id="welcome-button" type="button">Принять поздравление</button>
      <p class="welcome-error" id="welcome-error" role="status" aria-live="polite" hidden></p>
    </div>
  </section>

  <div class="night-city" aria-hidden="true">
    <div class="moon"></div>
    <div class="stars"></div>
    <div class="sky-glow"></div>
    <div class="city">
      <div class="building b1"></div>
      <div class="building b2"></div>
      <div class="building b3"></div>
      <div class="building b4"></div>
      <div class="building b5"></div>
      <div class="building b6"></div>
      <div class="building b7"></div>
      <div class="building b8"></div>
      <div class="building b9"></div>
    </div>
  </div>

  <canvas id="fireworks" aria-hidden="true"></canvas>

  <main class="card">
    <h1 class="greeting" id="greeting">Поздравляю с днем рождения!</h1>

    <div class="message" id="message"></div>

    <div class="download-wrap">
      <a class="download" href="gram.png" download="Поздравительная-грамота-Ангелины.png">
        <span class="download-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 5-5m-5 5-5-5M5 20h14"/></svg>
        </span>
        Скачать праздничную грамоту
      </a>
    </div>
  </main>

  <aside class="aside-note">
    <p>Чтобы закрыть это поздравление позвони айтишнику.</p>
    <p>P.S. Он хочет позвать тебя на кофе, но очень стесняется.</p>
    <strong>С днем рождения!</strong>
  </aside>

  <script src="script.js?v=welcome-screen-3"></script>
</body>
</html>
